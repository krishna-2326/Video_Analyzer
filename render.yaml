services:
  - type: web
    name: ai-video-agent
    env: python
    buildCommand: "apt-get update && apt-get install -y ffmpeg && pip install -r Requirements.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: MISTRAL_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: WHISPER_MODEL
        value: base
